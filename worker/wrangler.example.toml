# Cloudflare Worker 配置模板
name = "my"
main = "index.js"
compatibility_date = "2026-09-23"
preview_urls = false

# 定时调度（默认每小时第 27 分钟精准触发）
[triggers]
crons = ["27 * * * *"]

[vars]
GITHUB_APP_ID = "123"
GITHUB_APP_INSTALLATION_ID = "456"
VAULT_SECRET_KEY = "789"
CF_SCRIPT_NAME = "my"

[observability.logs]
enabled = true